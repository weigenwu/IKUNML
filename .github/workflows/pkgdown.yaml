name: pkgdown

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown
      - uses: r-lib/actions/pkgdown@v2
        with:
          deploy-to: gh-pages
